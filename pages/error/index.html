<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' browser://shared; img-src 'self' data:;" />
    <title data-i18n="page.error.docTitle">페이지를 열 수 없습니다</title>
    <!-- 다국어 로더(app/shared/i18n-core.ts 규약) — docs/i18n.md 참고 -->
    <script src="browser://shared/i18n.js"></script>
    <style>
      :root { color-scheme: light dark; --bg: #F7F7F8; --fg: #1A1A1A; --muted: #5F5F66; --card: #FFFFFF; --border: #E5E5E8; --accent: #3478F6; --danger: #C82A38; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0F0F12; --fg: #F2F2F5; --muted: #9B9BA3; --card: #1A1A1F; --border: #2A2A30; --accent: #5A93F9; --danger: #E5626D; }
      }
      html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', 'Apple SD Gothic Neo', sans-serif; }
      .wrap { max-width: 480px; margin: 0 auto; padding: 72px 24px; text-align: center; }
      .icon { font-size: 44px; margin-bottom: 18px; }
      h1 { font-size: 19px; margin: 0 0 10px; }
      .desc { font-size: 13px; color: var(--muted); margin: 0 0 6px; word-break: break-word; }
      .target { font-size: 12px; color: var(--muted); margin: 0 0 28px; word-break: break-all; }
      .target code { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; }
      .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      button { height: 36px; padding: 0 18px; border-radius: 18px; border: 1px solid var(--border); background: var(--card); color: inherit; cursor: pointer; font-size: 13px; }
      button:hover { border-color: var(--accent); color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.primary:hover { opacity: .92; color: #fff; }
      button.risk { color: var(--danger); border-color: var(--danger); }
      button.risk:hover { background: var(--danger); color: #fff; }
      .code { font-size: 11px; color: var(--muted); margin-top: 22px; }
      button:not(:disabled) { transition: transform 0.12s cubic-bezier(0.23, 1, 0.32, 1); }
      button:not(:disabled):active { transform: scale(0.97); }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="icon" id="icon">⚠️</div>
      <h1 id="title">이 페이지를 열 수 없습니다</h1>
      <p class="desc" id="desc"></p>
      <p class="target"><code id="url"></code></p>
      <div class="actions">
        <button class="primary" id="retry">다시 시도</button>
        <button id="risk" class="risk" hidden>위험을 감수하고 계속</button>
      </div>
      <p class="code" id="code"></p>
    </div>
    <script>
      const params = new URLSearchParams(location.search)
      const kind = params.get('kind') || 'load-fail'
      const desc = params.get('desc') || '알 수 없는 오류' // 메인(page-errors, M5 담당)이 이미 한국어로 번역해 보내는 문자열 —
      const url = params.get('url') || ''                    // 아래에서 kind/code 기반으로 가능한 만큼 클라이언트에서 다시 번역한다(못 찾으면 이 값을 그대로 표시).
      const code = params.get('code') || ''
      const host = params.get('host') || ''

      // browser://shared/i18n.js 가 window.t 를 심는다 — 전역 함수를 't' 로 재선언하면
      // 자기 자신을 호출해 무한 재귀가 나므로 다른 이름을 쓴다(docs/i18n.md 참고).
      function trSafe(key, fallback, vars) { return typeof window.t === 'function' ? window.t(key, fallback, vars) : fallback }

      // 메인(app/main/features/page-errors)의 FAIL_LOAD_KO 와 같은 Chromium net 에러 코드 집합.
      // main 을 고치지 않고도(M5 담당 파일) 페이지 쪽에서 code(숫자) 기준으로 다시 번역할 수 있게 한다.
      const NET_ERR_DESC_KEY = {
        '-105': 'nameNotResolved', '-102': 'connectionRefused', '-101': 'connectionReset',
        '-100': 'connectionClosed', '-118': 'connectionTimedOut', '-106': 'internetDisconnected',
        '-109': 'addressUnreachable', '-324': 'emptyResponse', '-107': 'sslProtocolError',
        '-21': 'networkChanged', '-6': 'fileNotFound', '-310': 'tooManyRedirects', '-20': 'blockedByClient',
      }
      // main 의 RENDER_GONE_LABELS 한국어 값을 역으로 매핑 — crash desc 는 "탭이 멈췄습니다 (충돌)" 식으로
      // 조립되어 오므로, 괄호 안 한국어 라벨을 읽어 원인 키를 되찾는다.
      const CRASH_LABEL_TO_KEY = {
        '충돌': 'crashed', '메모리 부족': 'oom', '실행 실패': 'launchFailed', '강제 종료': 'killed', '무결성 오류': 'integrityFailure',
      }

      function resolveDesc() {
        if (kind === 'cert') return trSafe('page.error.desc.certUntrusted', '이 사이트의 보안 인증서를 신뢰할 수 없습니다')
        if (kind === 'crash') {
          const m = /\(([^)]+)\)\s*$/.exec(desc)
          const reasonKey = m ? CRASH_LABEL_TO_KEY[m[1]] : undefined
          if (!reasonKey) return desc
          const label = trSafe('page.error.crashReason.' + reasonKey, m[1])
          return trSafe('page.error.desc.crashTemplate', '탭이 멈췄습니다 ({label})', { label })
        }
        const key = NET_ERR_DESC_KEY[code]
        return key ? trSafe('page.error.desc.net.' + key, desc) : desc
      }

      function applyContent() {
        const icons = { 'load-fail': '⚠️', crash: '💥', cert: '🔒' }
        document.getElementById('icon').textContent = icons[kind] || '⚠️'
        document.getElementById('title').textContent =
          kind === 'crash' ? trSafe('page.error.title.crash', '탭이 멈췄습니다')
          : kind === 'cert' ? trSafe('page.error.title.cert', '이 연결은 비공개로 설정되어 있지 않습니다')
          : trSafe('page.error.title.loadFail', '이 페이지를 열 수 없습니다')
        document.getElementById('desc').textContent = resolveDesc() // textContent — 문자열을 그대로 HTML 로 해석하지 않음
        document.getElementById('url').textContent = url
        document.getElementById('code').textContent = code ? trSafe('page.error.codeLabel', '오류 코드: {code}', { code }) : ''
        document.getElementById('retry').textContent = kind === 'crash' ? trSafe('page.error.retry.reload', '새로고침') : trSafe('page.error.retry.default', '다시 시도')
        const riskBtn = document.getElementById('risk')
        riskBtn.textContent = trSafe('page.error.risk', '위험을 감수하고 계속')
      }
      applyContent()
      if (typeof window.onI18nChanged === 'function') {
        window.onI18nChanged(() => { try { applyContent() } catch (e) {} })
      }

      document.getElementById('retry').addEventListener('click', () => {
        if (url) location.href = url
        else history.back()
      })

      if (kind === 'cert' && url) {
        const riskBtn = document.getElementById('risk')
        riskBtn.hidden = false
        riskBtn.addEventListener('click', () => {
          // IPC 없이 같은 문서 안에서 해시만 바꿔 메인 프로세스(page-errors 모듈)에 신호를 보낸다.
          // 메인이 이 탭의 did-navigate-in-page 를 이미 지켜보고 있다가 받아서 처리한다.
          const payload = encodeURIComponent(JSON.stringify({ host, target: url }))
          location.hash = 'bypass-cert=' + payload
        })
      }
    </script>
  </body>
</html>
